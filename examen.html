<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nota 10</title>
    <link rel="stylesheet" href="examen.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Recapitulare ca să dai pe zece</p>
          <h1>momentan nu exersați - mentenanță</h1>
        </div>
        <div class="topbar-actions">
          <button class="ghost-button" id="resetProgress" type="button">
            Începe de la zero brat
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="quiz-area" aria-live="polite">
          <div class="status-strip" id="statusStrip"></div>
          <article class="question-card" id="questionCard"></article>
        </section>

        <aside class="question-nav" aria-label="Navigare întrebări">
          <div class="nav-header">
            <div>
              <p class="eyebrow">aici am pus tipa categoriile</p>
              <h2>aici tipa îs întrebările</h2>
            </div>
            <input
              id="questionSearch"
              type="search"
              placeholder="Caută după condiție"
              autocomplete="off"
            />
          </div>
          <div class="category-list" id="categoryList"></div>
        </aside>
      </main>
    </div>

    <script src="examen.js"></script>
  </body>
</html>
