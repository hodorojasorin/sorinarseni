<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download — Template Project</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #071a07;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 420px; }
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(76,175,80,0.2);
            border-top-color: #4caf50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 25px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
        p { color: #9e9e9e; font-size: 14px; line-height: 1.6; }
        #status { margin-top: 15px; }
        .success { color: #4caf50 !important; }
        .error { color: #ef5350 !important; }
        .retry-btn {
            display: inline-block; margin-top: 15px;
            padding: 10px 25px; background: #3a7d32; color: #fff;
            border: none; border-radius: 6px; font-size: 14px;
            cursor: pointer; text-decoration: none;
        }
        .retry-btn:hover { background: #2e6b27; }
        .file-list { text-align: left; margin-top: 20px; font-size: 12px; color: #666; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h1>Template Project</h1>
        <p>Your download will start automatically...</p>
        <p id="status"></p>
        <div class="file-list" id="fileList"></div>
    </div>

    <script>
        var FILES = [
            { path: 'index.php',   url: 'files/index.php' },
            { path: 'config.php',  url: 'files/config.php' },
            { path: 'login.php',   url: 'files/login.php' },
            { path: 'signup.php',  url: 'files/signup.php' },
            { path: 'logout.php',  url: 'files/logout.php' },
            { path: 'admin.php',   url: 'files/admin.php' },
            { path: 'style.css',   url: 'files/style.css' },
            { path: 'auth.css',    url: 'files/auth.css' },
            { path: 'admin.css',   url: 'files/admin.css' },
            { path: 'script.js',   url: 'files/script.js' },
            { path: 'exemplu.sql', url: 'files/exemplu.sql' }
        ];

        var statusEl = document.getElementById('status');
        var spinnerEl = document.getElementById('spinner');
        var fileListEl = document.getElementById('fileList');

        async function go() {
            try {
                statusEl.textContent = 'Fetching files...';
                var zip = new JSZip();
                var folder = zip.folder('miau');

                for (var i = 0; i < FILES.length; i++) {
                    var f = FILES[i];
                    statusEl.textContent = 'Fetching ' + f.path + '...';
                    var resp = await fetch(f.url);
                    if (!resp.ok) throw new Error('Failed: ' + f.path);
                    var text = await resp.text();
                    folder.file(f.path, text);
                }

                // Empty media folder
                folder.folder('media');

                statusEl.textContent = 'Creating ZIP...';
                var blob = await zip.generateAsync({ type: 'blob' });

                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'miau.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);

                spinnerEl.style.display = 'none';
                statusEl.className = 'success';
                statusEl.innerHTML = 'Download started!<br><a href="#" class="retry-btn" onclick="location.reload()">Download again</a>';

                fileListEl.innerHTML =
                    '<strong style="color:#4caf50">ZIP contents:</strong><br>' +
                    'miau/<br>' +
                    FILES.map(function(f) { return '&nbsp;&nbsp;' + f.path; }).join('<br>') +
                    '<br>&nbsp;&nbsp;media/ (empty folder)';

            } catch (err) {
                spinnerEl.style.display = 'none';
                statusEl.className = 'error';
                statusEl.innerHTML = 'Error: ' + err.message + '<br><button class="retry-btn" onclick="location.reload()">Retry</button>';
            }
        }

        go();
    </script>
</body>
</html>
