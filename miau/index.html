<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>miau</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="spinner" id="spinner"></div>
      <p id="status"></p>
    </div>

    <script>
      var FILES = [
        { path: "index.php", url: "files/index.php" },
        { path: "config.php", url: "files/config.php" },
        { path: "login.php", url: "files/login.php" },
        { path: "signup.php", url: "files/signup.php" },
        { path: "logout.php", url: "files/logout.php" },
        { path: "admin.php", url: "files/admin.php" },
        { path: "style.css", url: "files/style.css" },
        { path: "auth.css", url: "files/auth.css" },
        { path: "admin.css", url: "files/admin.css" },
        { path: "script.js", url: "files/script.js" },
        { path: "exemplu.sql", url: "files/exemplu.sql" },
      ];

      var statusEl = document.getElementById("status");
      var spinnerEl = document.getElementById("spinner");
      var fileListEl = document.getElementById("fileList");

      async function go() {
        try {
          statusEl.textContent = "Fetching files...";
          var zip = new JSZip();
          var folder = zip.folder("miau");

          for (var i = 0; i < FILES.length; i++) {
            var f = FILES[i];
            statusEl.textContent = "Fetching " + f.path + "...";
            var resp = await fetch(f.url);
            if (!resp.ok) throw new Error("Failed: " + f.path);
            var text = await resp.text();
            folder.file(f.path, text);
          }

          // Empty media folder
          folder.folder("media");

          statusEl.textContent = "Creating ZIP...";
          var blob = await zip.generateAsync({ type: "blob" });

          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "miau.zip";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(a.href);

          spinnerEl.style.display = "none";
          statusEl.className = "success";
          statusEl.innerHTML =
            'Download started!<br><a href="#" class="retry-btn" onclick="location.reload()">Download again</a>';

          fileListEl.innerHTML =
            '<strong style="color:#4caf50">ZIP contents:</strong><br>' +
            "miau/<br>" +
            FILES.map(function (f) {
              return "&nbsp;&nbsp;" + f.path;
            }).join("<br>") +
            "<br>&nbsp;&nbsp;media/ (empty folder)";
        } catch (err) {
          spinnerEl.style.display = "none";
          statusEl.className = "error";
          statusEl.innerHTML =
            "Error: " +
            err.message +
            '<br><button class="retry-btn" onclick="location.reload()">Retry</button>';
        }
      }

      go();
    </script>
  </body>
</html>
