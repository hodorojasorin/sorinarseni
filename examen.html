<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recapitulare examen web</title>
  <link rel="stylesheet" href="examen.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Recapitulare examen</p>
        <h1>Platformă de pregătire web</h1>
      </div>
      <div class="topbar-actions">
        <button class="ghost-button" id="resetProgress" type="button">Reset progres</button>
      </div>
    </header>

    <main class="workspace">
      <section class="quiz-area" aria-live="polite">
        <div class="status-strip" id="statusStrip"></div>
        <article class="question-card" id="questionCard"></article>
      </section>

      <aside class="question-nav" aria-label="Navigare întrebări">
        <div class="nav-header">
          <div>
            <p class="eyebrow">Categorii</p>
            <h2>Întrebări</h2>
          </div>
          <input id="questionSearch" type="search" placeholder="Caută" autocomplete="off">
        </div>
        <div class="category-list" id="categoryList"></div>
      </aside>
    </main>
  </div>

  <script src="examen.js"></script>
</body>
</html>
